services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fipe-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
      - MONGO_URI=${MONGO_URI:-mongodb://root:123456@host.docker.internal:27017/?authSource=admin}
      - MONGO_DATABASE=${MONGO_DATABASE:-fipe_db}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - fipe-net

networks:
  fipe-net:
    driver: bridge
